trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - master

variables:
  buildConfiguration: 'Release'
  dotnetSdkVersion: '8.x'
  solutionPath: 'GiftOfTheGivers.sln'
  webProject: 'GiftOfTheGivers.Web/GiftOfTheGivers.Web.csproj'
  unitTestProject: 'GiftOfTheGivers.Tests.Unit/GiftOfTheGivers.Tests.Unit.csproj'
  integrationTestProject: 'GiftOfTheGivers.Tests.Integration/GiftOfTheGivers.Tests.Integration.csproj'
  functionsProject: 'GiftOfTheGivers.Functions/GiftOfTheGivers.Functions.csproj'
  functionAppName: 'gotg-functions-st10311127'
  functionAppUrl: 'https://gotg-functions-st10311127-fwf6fzhjbwasa0c5.southafricanorth-01.azurewebsites.net'
  webProdUrl: 'https://giftofthegiverssa-gubpd7bqbed6dvdn.southafricanorth-01.azurewebsites.net'
  testResultsDir: '$(Agent.TempDirectory)/TestResults'

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildTest
        displayName: 'Restore, build, test, publish'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK $(dotnetSdkVersion)'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetSdkVersion)'

          - task: NuGetAuthenticate@1
            displayName: 'Authenticate to Azure Artifacts'

          - task: DotNetCoreCLI@2
            displayName: 'Restore'
            inputs:
              command: 'restore'
              projects: '$(solutionPath)'

          - task: DotNetCoreCLI@2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: '$(solutionPath)'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Run unit tests'
            inputs:
              command: 'test'
              projects: '$(unitTestProject)'
              publishTestResults: false
              arguments: '--configuration $(buildConfiguration) --no-build --filter "Category!=UI" --collect:"XPlat Code Coverage" --logger trx --results-directory $(testResultsDir)'

          - task: DotNetCoreCLI@2
            displayName: 'Run integration tests'
            inputs:
              command: 'test'
              projects: '$(integrationTestProject)'
              publishTestResults: false
              arguments: '--configuration $(buildConfiguration) --no-build --filter "Category!=UI&Category!=Functions" --collect:"XPlat Code Coverage" --logger trx --results-directory $(testResultsDir)'

          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: always()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/*.trx'
              searchFolder: '$(testResultsDir)'
              mergeTestResults: true
              failTaskOnMissingResultsFile: false
              testRunTitle: 'Unit and Integration Tests'

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish code coverage'
            condition: always()
            inputs:
              summaryFileLocation: '$(testResultsDir)/**/coverage.cobertura.xml'

          - task: DotNetCoreCLI@2
            displayName: 'Publish web app'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: '$(webProject)'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/web'
              zipAfterPublish: true

          - task: DotNetCoreCLI@2
            displayName: 'Publish Functions app'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: '$(functionsProject)'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/functions'
              zipAfterPublish: true

          - script: |
              dotnet tool install --global dotnet-ef --version 8.0.20
              echo "##vso[task.prependpath]$HOME/.dotnet/tools"
            displayName: 'Install dotnet-ef'

          - script: >
              dotnet ef migrations script
              --idempotent
              --project $(webProject)
              --configuration $(buildConfiguration)
              --no-build
              --output $(Build.ArtifactStagingDirectory)/sql/migrate.sql
            displayName: 'Generate idempotent migration script'

          - script: >
              dotnet ef migrations bundle
              --project $(webProject)
              --configuration $(buildConfiguration)
              --self-contained
              --runtime linux-x64
              --output $(Build.ArtifactStagingDirectory)/sql/efbundle
              --force
            displayName: 'Build migration bundle'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish web artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/web'
              artifact: 'web'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish SQL artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/sql'
              artifact: 'sql'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Functions artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/functions'
              artifact: 'functions'

  - stage: Database
    displayName: 'Apply SQL migrations'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    variables:
      - group: 'gotg-sql'
    jobs:
      - deployment: ApplyMigrations
        displayName: 'Apply EF Core migrations to Azure SQL'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'Database'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'sql'

                - script: |
                    chmod +x $(Pipeline.Workspace)/sql/efbundle
                    $(Pipeline.Workspace)/sql/efbundle --connection "$SQL_CONNECTION"
                  displayName: 'Apply migrations to Azure SQL'
                  env:
                    SQL_CONNECTION: $(sqlConnectionString)
                    ConnectionStrings__DefaultConnection: $(sqlConnectionString)

  - stage: DeployFunctions
    displayName: 'Deploy Azure Functions'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    variables:
      - group: 'gotg-functions'
    jobs:
      - job: DeployFunctionApp
        displayName: 'Deploy to gotg-functions-st10311127'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - download: current
            artifact: 'functions'

          - script: |
              zip=$(find "$(Pipeline.Workspace)/functions" -name '*.zip' | head -n 1)
              if [ -z "$zip" ]; then echo "No zip found"; ls -R "$(Pipeline.Workspace)/functions"; exit 1; fi
              echo "Deploying $zip to $SCM_HOST"
              code=$(curl -s -o response.txt -w "%{http_code}" -u "$DEPLOY_USER:$DEPLOY_PASSWORD" -X POST --data-binary @"$zip" -H "Content-Type: application/zip" "https://$SCM_HOST/api/zipdeploy?isAsync=false")
              cat response.txt
              echo "Zip deploy HTTP status: $code"
              if [ "$code" != "200" ] && [ "$code" != "202" ]; then exit 1; fi
            displayName: 'Deploy Function App (Kudu zip deploy)'
            env:
              SCM_HOST: $(functionsScmHost)
              DEPLOY_USER: $(functionsDeployUser)
              DEPLOY_PASSWORD: $(functionsDeployPassword)

          - script: |
              sleep 30
              code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$(functionAppUrl)/api/projectupdates/log" -H "Content-Type: application/json" -d '{}')
              echo "Smoke test HTTP status: $code"
              if [ "$code" -ge 500 ] || [ "$code" = "000" ] || [ "$code" = "404" ]; then exit 1; fi
            displayName: 'Smoke test Functions endpoint'

  - stage: DeployWebStaging
    displayName: 'Deploy web app to Staging'
    dependsOn:
      - Build
      - Database
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    variables:
      - group: 'gotg-web'
    jobs:
      - deployment: DeployStaging
        displayName: 'Zip deploy to giftofthegiverssa-staging'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'Staging'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'web'

                - script: |
                    zip=$(find "$(Pipeline.Workspace)/web" -name '*.zip' | head -n 1)
                    if [ -z "$zip" ]; then echo "No zip found"; ls -R "$(Pipeline.Workspace)/web"; exit 1; fi
                    echo "Deploying $zip to $SCM_HOST"
                    code=$(curl -s -o response.txt -w "%{http_code}" -u "$DEPLOY_USER:$DEPLOY_PASSWORD" -X POST --data-binary @"$zip" -H "Content-Type: application/zip" "https://$SCM_HOST/api/zipdeploy?isAsync=false")
                    cat response.txt
                    echo "Zip deploy HTTP status: $code"
                    if [ "$code" != "200" ] && [ "$code" != "202" ]; then exit 1; fi
                  displayName: 'Deploy web app to Staging (Kudu zip deploy)'
                  env:
                    SCM_HOST: $(webStagingScmHost)
                    DEPLOY_USER: $(webStagingUser)
                    DEPLOY_PASSWORD: $(webStagingPassword)

                - script: |
                    for i in $(seq 1 12); do
                      code=$(curl -s -o /dev/null -w "%{http_code}" "$(webStagingUrl)/")
                      echo "Attempt $i: Staging home page HTTP status $code"
                      if [ "$code" = "200" ]; then exit 0; fi
                      sleep 15
                    done
                    exit 1
                  displayName: 'Smoke test Staging'

  - stage: DeployWebProduction
    displayName: 'Deploy web app to Production'
    dependsOn: DeployWebStaging
    condition: succeeded()
    variables:
      - group: 'gotg-web'
    jobs:
      - deployment: DeployProduction
        displayName: 'Zip deploy to giftofthegiverssa (Production)'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'Production'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'web'

                - script: |
                    zip=$(find "$(Pipeline.Workspace)/web" -name '*.zip' | head -n 1)
                    if [ -z "$zip" ]; then echo "No zip found"; ls -R "$(Pipeline.Workspace)/web"; exit 1; fi
                    echo "Deploying $zip to $SCM_HOST"
                    code=$(curl -s -o response.txt -w "%{http_code}" -u "$DEPLOY_USER:$DEPLOY_PASSWORD" -X POST --data-binary @"$zip" -H "Content-Type: application/zip" "https://$SCM_HOST/api/zipdeploy?isAsync=false")
                    cat response.txt
                    echo "Zip deploy HTTP status: $code"
                    if [ "$code" != "200" ] && [ "$code" != "202" ]; then exit 1; fi
                  displayName: 'Deploy web app to Production (Kudu zip deploy)'
                  env:
                    SCM_HOST: $(webProdScmHost)
                    DEPLOY_USER: $(webProdUser)
                    DEPLOY_PASSWORD: $(webProdPassword)

                - script: |
                    for i in $(seq 1 12); do
                      code=$(curl -s -o /dev/null -w "%{http_code}" "$(webProdUrl)/")
                      echo "Attempt $i: Production home page HTTP status $code"
                      if [ "$code" = "200" ]; then exit 0; fi
                      sleep 15
                    done
                    exit 1
                  displayName: 'Smoke test Production'
